name: Electrician
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Electrician:
    type: application
    platform: iOS
    sources:
      - path: Electrician
        excludes:
          - Electrician.storekit
      - path: Shared
      - path: Electrician/Electrician.storekit
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.electrician
        PRODUCT_NAME: "Electrician"
        PRODUCT_MODULE_NAME: Electrician
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Electrician/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # The StoreKit Testing catalog is a Debug-only prop: the paywall render
        # test reads it so a simulator can show real prices without configuring
        # RevenueCat. It has no business inside the App Store binary, where it
        # would ship our price schedule as a readable JSON file.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Electrician.storekit
    dependencies:
      - package: RevenueCat

  ElectricianTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ElectricianTests
    dependencies:
      - target: Electrician
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Electrician.app/Electrician"

  # App Store screenshot capture. Deliberately NOT in the Electrician scheme's
  # test action: it drives the real UI and takes a minute, and the unit-test
  # loop should stay instant. Drive it with scripts/capture-screenshots.sh.
  ElectricianScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ElectricianScreenshots
    dependencies:
      - target: Electrician
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Electrician

schemes:
  Electrician:
    build:
      targets:
        Electrician: all
    run:
      config: Debug
      storeKitConfiguration: Electrician/Electrician.storekit
    test:
      config: Debug
      targets:
        - ElectricianTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        Electrician: all
        ElectricianScreenshots: [test]
    test:
      config: Debug
      testPlans:
        - path: ElectricianScreenshots/Screenshots.xctestplan
      targets:
        - ElectricianScreenshots
